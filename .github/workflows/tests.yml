name: Public regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environments/requirements-tests.txt
      - run: python -m pip install -r environments/requirements-tests.txt
      - run: python -m unittest discover -s pipeline -p 'test_*.py' -v
      - run: python scripts/check_publication.py
